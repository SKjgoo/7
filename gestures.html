<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لعبة الحركات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one big character stage, camera preview inset on it, three expression cards below, challenge bar on top. Single dark look. */
:root{--bg:#121629;--bg2:#1b2140;--paper:#f3eee6;--muted:#aab0c8;--hair:#f08a3c;--sky:#aebbe0;--good:#58c58b;--bad:#e2604f;--line:rgba(243,238,230,.16);--display:'Reem Kufi','Segoe UI',Tahoma,sans-serif;--body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--paper);font:400 16px/1.6 var(--body);-webkit-tap-highlight-color:transparent}
body{padding-block:max(14px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--hair);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;display:grid;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font:700 30px/1.2 var(--display)}
.score{display:inline-flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:500}
.score b{font:700 22px var(--display);color:var(--hair);font-variant-numeric:tabular-nums}
.modes{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px}
.modes button{background:transparent;border:0;border-radius:999px;padding:7px 18px;font-weight:600}
.modes button[aria-pressed="true"]{background:var(--hair);color:#1b0f04}
#stage{position:relative;aspect-ratio:16/10;max-height:68vh;width:100%;border-radius:20px;overflow:hidden;background:var(--sky);border:1px solid var(--line)}
#stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .18s}
#stage img.on{opacity:1;animation:pop .32s ease-out}
@keyframes pop{0%{transform:scale(1.045)}100%{transform:scale(1)}}
#idle{position:absolute;inset:0;display:grid;place-content:center;gap:8px;text-align:center;padding:20px;background:linear-gradient(160deg,#27305a,#161b36)}
#idle b{font:700 30px/1.3 var(--display)}
#idle span{color:var(--muted);max-width:30ch;margin:0 auto}
#tag{position:absolute;right:12px;bottom:12px;background:rgba(18,22,41,.78);border:1px solid var(--line);border-radius:999px;padding:5px 16px;font:700 18px var(--display);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#pip{position:absolute;left:12px;top:12px;width:min(30%,170px);aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:2px solid var(--hair);background:#000}
#pip canvas{width:100%;height:100%;display:block}
#target{position:absolute;right:12px;top:12px;background:rgba(18,22,41,.86);border:1.5px solid var(--hair);border-radius:16px;padding:8px 20px;text-align:center;min-width:150px;max-width:calc(70% - 30px)}
#target small{display:block;color:var(--hair);font-weight:600;font-size:13px}
#target strong{font:700 24px/1.3 var(--display)}
#bar{height:5px;background:rgba(243,238,230,.18);border-radius:4px;margin-top:6px;overflow:hidden}
#bar i{display:block;height:100%;width:100%;background:var(--hair);transform-origin:right}
#fb{position:absolute;inset:0;display:grid;place-content:center;font:700 54px var(--display);color:#fff;text-shadow:0 3px 18px rgba(0,0,0,.7);pointer-events:none;opacity:0}
#fb.show{animation:fbk .9s ease-out}
@keyframes fbk{0%{opacity:0;transform:scale(.8)}20%{opacity:1;transform:scale(1.08)}100%{opacity:0;transform:scale(1)}}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#cam{background:var(--hair);color:#1b0f04;border:0;border-radius:14px;padding:12px 26px;font:700 18px var(--display);min-height:50px}
#cam.on{background:transparent;color:var(--paper);border:1.5px solid var(--line);font-size:16px}
#cam:disabled{opacity:.6}
#st{color:var(--muted);font-size:14px;flex:1 1 200px}
#st.err{color:#f39a8c}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{display:grid;gap:6px;justify-items:center;text-align:center;background:var(--bg2);border:1.5px solid var(--line);border-radius:16px;padding:12px 8px;transition:border-color .15s,background .15s}
.card img{width:56px;height:56px;border-radius:50%;object-fit:cover;object-position:50% 30%;border:2px solid var(--line)}
.card b{font:700 19px var(--display)}
.card span{font-size:13px;color:var(--muted);line-height:1.5}
.card.on{border-color:var(--hair);background:rgba(240,138,60,.14)}
.card.on img{border-color:var(--hair)}
#end{text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:22px 16px}
#end .big{font:700 64px/1 var(--display);color:var(--hair);font-variant-numeric:tabular-nums}
#end p{margin:6px 0 14px;color:var(--muted)}
#end button{background:var(--hair);color:#1b0f04;border:0;border-radius:12px;padding:11px 24px;font:700 17px var(--display)}
@media (max-width:520px){h1{font-size:24px}.card span{font-size:12px}.card b{font-size:17px}#tag{font-size:16px}#target strong{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>لعبة الحركات</h1>
    <div class="modes" role="group" aria-label="نوع اللعب"><button id="m-free" aria-pressed="true">حر</button><button id="m-ch" aria-pressed="false">تحدّي</button></div>
    <div class="score">النقاط <b id="pts">0</b></div>
  </header>

  <div id="stage">
    <img id="i-angry" alt="غاضبة"><img id="i-surprised" alt="مصدومة"><img id="i-happy" alt="سعيدة">
    <div id="idle"><b>سوّ حركة بوجهك أو يدك</b><span>شغّل الكاميرا، وكل ما تغيّر تعابير وجهك أو تحرّك يدك تتغير الصورة.</span></div>
    <div id="tag" hidden></div>
    <div id="pip" hidden><canvas id="pv" width="170" height="128"></canvas></div>
    <div id="target" hidden><small id="tr">الجولة</small><strong id="tn"></strong><div id="bar"><i id="barI"></i></div></div>
    <div id="fb"></div>
  </div>

  <div class="ctl"><button id="cam" disabled>شغّل الكاميرا</button><div id="st" role="status">جارٍ تحميل التعرف على الوجه واليد…</div></div>

  <div class="cards">
    <button class="card" data-e="angry"><img data-t="angry" alt=""><b>غاضبة</b><span>قطّب حاجبيك، أو اقبض يدك، أو أشر بإصبع واحد</span></button>
    <button class="card" data-e="surprised"><img data-t="surprised" alt=""><b>مصدومة</b><span>افتح فمك، أو ارفع كفك مفتوحة</span></button>
    <button class="card" data-e="happy"><img data-t="happy" alt=""><b>سعيدة</b><span>ابتسم، أو إبهام للأعلى، أو علامة النصر، أو يدين</span></button>
  </div>

  <div id="end" hidden><div class="big" id="endS">0</div><p id="endM"></p><button id="again">جولة جديدة</button></div>
</div>

const NAMES={angry:'غاضبة',surprised:'مصدومة',happy:'سعيدة'};
const KEYS=['angry','surprised','happy'];
KEYS.forEach(k=>{$('#i-'+k).src=IMG[k].s;document.querySelector('.card img[data-t="'+k+'"]').src=IMG[k].s});

/* ---------- classification ---------- */
const d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function handEmotion(lms){
 if(!lms||!lms.length)return null;
 if(lms.length>=2)return 'happy';
 const l=lms[0],w=l[0];
 const ext=(t,p)=>d2(l[t],w)>d2(l[p],w)*1.12;
 const idx=ext(8,6),mid=ext(12,10),rng=ext(16,14),pnk=ext(20,18),n=(idx?1:0)+(mid?1:0)+(rng?1:0)+(pnk?1:0);
 const thumb=d2(l[4],l[17])>d2(l[3],l[17])*1.08;
 if(n===0&&thumb&&l[4].y<l[5].y-.04&&l[4].y<w.y)return 'happy';
 if(n===0)return 'angry';
 if(n===4)return 'surprised';
 if(idx&&mid&&!rng&&!pnk)return 'happy';
 if(idx&&!mid&&!rng&&!pnk)return 'angry';
 return null;
}
function faceEmotion(cats){
 if(!cats)return null;const b={};cats.forEach(c=>b[c.categoryName]=c.score);
 const g=k=>b[k]||0,smile=(g('mouthSmileLeft')+g('mouthSmileRight'))/2,brow=(g('browDownLeft')+g('browDownRight'))/2,
  open=g('jawOpen'),wide=(g('eyeWideLeft')+g('eyeWideRight'))/2,up=g('browInnerUp');
 const sSurprise=open*1.1+up*.5+wide*.6,sHappy=smile*1.25,sAngry=brow*1.2+(g('noseSneerLeft')+g('noseSneerRight'))*.3+g('mouthFrownLeft')*.2+g('mouthFrownRight')*.2;
 if(open>.3&&sSurprise>=sHappy&&sSurprise>=sAngry&&brow<.5)return 'surprised';
 if(smile>.4&&sHappy>=sAngry)return 'happy';
 if(brow>.45&&smile<.25&&open<.35)return 'angry';
 return null;
}
window.__g={handEmotion:handEmotion,faceEmotion:faceEmotion};

/* ---------- display ---------- */
let cur=null,lastChange=0;
function show(e,fromUser){
 if(e===cur)return;cur=e;lastChange=performance.now();
 $('#idle').hidden=true;
 KEYS.forEach(k=>{const im=$('#i-'+k);im.classList.toggle('on',k===e)});
 document.querySelectorAll('.card').forEach(c=>c.classList.toggle('on',c.dataset.e===e));
 const t=$('#tag');t.hidden=false;t.textContent=NAMES[e];
 if(mode==='ch'&&round&&!fromUser)onEmotion(e);
}
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>show(c.dataset.e,true)));

/* ---------- challenge ---------- */
let mode='free',round=null,total=0;
const ROUNDS=8,ROUND_MS=6000;
let timer=0;
function setPts(n){total=n;$('#pts').textContent=n}
function setMode(m){
 mode=m;$('#m-free').setAttribute('aria-pressed',String(m==='free'));$('#m-ch').setAttribute('aria-pressed',String(m==='ch'));
 clearInterval(timer);round=null;$('#target').hidden=true;$('#end').hidden=true;
 if(m==='ch'){setPts(0);if(running)nextRound(0);else{setStatus('شغّل الكاميرا لتبدأ التحدّي')}}
}
$('#m-free').addEventListener('click',()=>setMode('free'));$('#m-ch').addEventListener('click',()=>setMode('ch'));
function nextRound(i){
 if(i>=ROUNDS){return finish()}
 const opts=KEYS.filter(k=>k!==cur),t=opts[Math.floor(Math.random()*opts.length)];
 round={i:i,t:t,t0:performance.now(),done:false};
 $('#target').hidden=false;$('#tr').textContent='الجولة '+(i+1)+' من '+ROUNDS;$('#tn').textContent='سوّ حركة: '+NAMES[t];
 clearInterval(timer);timer=setInterval(()=>{
  const left=ROUND_MS-(performance.now()-round.t0);$('#barI').style.transform='scaleX('+Math.max(0,left/ROUND_MS)+')';
  if(left<=0){clearInterval(timer);flash('انتهى الوقت',false);setTimeout(()=>nextRound(round.i+1),900)}},60);
}
function onEmotion(e){
 if(!round||round.done)return;
 if(e===round.t){round.done=true;clearInterval(timer);const left=Math.max(0,ROUND_MS-(performance.now()-round.t0)),p=10+Math.round(left/1000*2);setPts(total+p);flash('+'+p,true);const i=round.i;setTimeout(()=>nextRound(i+1),1000)}
}
function flash(t,ok){const f=$('#fb');f.textContent=t;f.style.color=ok?'#9af0c0':'#ffb3a8';f.classList.remove('show');void f.offsetWidth;f.classList.add('show')}
function finish(){round=null;$('#target').hidden=true;$('#end').hidden=false;$('#endS').textContent=total;
 $('#endM').textContent=total>=110?'ممتاز، وجهك ويدك سريعان.':total>=60?'نتيجة جيدة، حاول تكون أسرع.':'بداية طيبة، جرّب مرة ثانية.'}
$('#again').addEventListener('click',()=>{$('#end').hidden=true;setPts(0);nextRound(0)});

/* ---------- camera + MediaPipe ---------- */
const MP='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODELS={hand:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',face:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'};
let hl=null,fl=null,vid=null,stream=null,running=false,lastT=-1,frameN=0,candE=null,candN=0,faceE=null,handE=null,lastHand=null;
function setStatus(m,err){const s=$('#st');s.textContent=m;s.classList.toggle('err',!!err)}
async function loadModels(){
 const m=await import(MP+'/vision_bundle.mjs');
 const fs=await m.FilesetResolver.forVisionTasks(MP+'/wasm');
 const mk=async(C,model,extra)=>{
  const o=d=>Object.assign({baseOptions:{modelAssetPath:model,delegate:d},runningMode:'VIDEO'},extra);
  try{return await C.createFromOptions(fs,o('GPU'))}catch(e){return await C.createFromOptions(fs,o('CPU'))}};
 hl=await mk(m.HandLandmarker,MODELS.hand,{numHands:2});
 fl=await mk(m.FaceLandmarker,MODELS.face,{numFaces:1,outputFaceBlendshapes:true});
}
const cb=$('#cam');
cb.addEventListener('click',()=>{running?stopCam():startCam()});
async function startCam(){
 if(running||!hl)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus('الكاميرا غير متاحة هنا. افتح الصفحة من رابط https.',1);return}
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
  vid=document.createElement('video');vid.muted=true;vid.playsInline=true;vid.srcObject=stream;await vid.play();
 }catch(e){stopCam();setStatus('تعذّر تشغيل الكاميرا. اسمح بالإذن في المتصفح وحاول مرة ثانية.',1);return}
 running=true;lastT=-1;cb.textContent='أوقف الكاميرا';cb.classList.add('on');$('#pip').hidden=false;setStatus('الكاميرا شغّالة. غيّر تعابير وجهك أو حرّك يدك.');
 if(mode==='ch'&&!round)nextRound(0);
 requestAnimationFrame(tick);
}
function stopCam(){
 running=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;vid=null;
 cb.textContent='شغّل الكاميرا';cb.classList.remove('on');$('#pip').hidden=true;faceE=handE=null;
}
const HC=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawPip(hands){
 const c=$('#pv'),g=c.getContext('2d'),W=c.width,H=c.height;g.save();g.translate(W,0);g.scale(-1,1);g.drawImage(vid,0,0,W,H);g.restore();
 g.strokeStyle='#f08a3c';g.fillStyle='#fff';g.lineWidth=2;
 (hands||[]).forEach(l=>{g.beginPath();HC.forEach(p=>{g.moveTo((1-l[p[0]].x)*W,l[p[0]].y*H);g.lineTo((1-l[p[1]].x)*W,l[p[1]].y*H)});g.stroke();l.forEach(p=>{g.beginPath();g.arc((1-p.x)*W,p.y*H,2,0,6.3);g.fill()})});
}
function tick(){
 if(!running)return;requestAnimationFrame(tick);
 if(!vid||vid.readyState<2||vid.currentTime===lastT)return;lastT=vid.currentTime;frameN++;
 const now=performance.now();
 try{
  if(frameN%2===0){const r=fl.detectForVideo(vid,now);faceE=faceEmotion(r.faceBlendshapes&&r.faceBlendshapes[0]&&r.faceBlendshapes[0].categories)}
  else{const r=hl.detectForVideo(vid,now);lastHand=r.landmarks||[];handE=handEmotion(lastHand)}
 }catch(e){setStatus('حدث خطأ في التعرف: '+e.message,1);return}
 drawPip(lastHand);
 const e=faceE||handE;
 if(e){if(e===candE){candN++}else{candE=e;candN=1}if(candN>=3)show(e,false)}else{candN=0;candE=null}
}
(async function init(){
 try{await loadModels();cb.disabled=false;setStatus('جاهز. اضغط «شغّل الكاميرا».')}
 catch(e){setStatus('تعذّر تحميل نماذج التعرف. تأكد من الإنترنت وحدّث الصفحة. لتجربة الصور اضغط على البطاقات.',1);console.error(e)}
})();
})();
</script>
